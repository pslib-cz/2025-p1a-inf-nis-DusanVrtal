<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b" />
    </marker>
  </defs>
  <style>
    .bg-dark { fill: #0f172a; }
    .box-client { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; }
    .box-server { fill: #1e293b; stroke: #10b981; stroke-width: 2; }
    .box-db { fill: #1e293b; stroke: #6366f1; stroke-width: 2; }
    .box-ext { fill: #1e293b; stroke: #f59e0b; stroke-width: 2; }
    .text-main { font-family: sans-serif; font-size: 14px; fill: #f8fafc; font-weight: bold; }
    .text-sub { font-family: sans-serif; font-size: 11px; fill: #94a3b8; }
    .text-title { font-family: sans-serif; font-size: 11px; font-weight: bold; fill: #cbd5e1; letter-spacing: 1; }
    .arrow { stroke: #64748b; stroke-width: 1.5; fill: none; }
    .arrow-double { stroke: #818cf8; stroke-width: 1.5; stroke-dasharray: 4; fill: none; }
    .badge { font-family: sans-serif; font-size: 10px; font-weight: bold; fill: #0f172a; }
  </style>

  <rect width="100%" height="100%" class="bg-dark" />

  <!-- KLIENTSKÁ VRSTVA -->
  <g transform="translate(40, 40)">
    <rect width="240" height="560" class="box-client" rx="8"/>
    <text x="20" y="30" class="text-title" fill="#38bdf8">KLIENTSKÁ VRSTVA (BROWSER)</text>
    <g transform="translate(20, 60)">
      <rect width="200" height="70" fill="#0f172a" stroke="#334155" rx="4"/>
      <text x="15" y="30" class="text-main">Veřejné stránky</text>
      <text x="15" y="50" class="text-sub">Landing page, žebříčky, profily</text>
    </g>
    <g transform="translate(20, 150)">
      <rect width="200" height="110" fill="#0f172a" stroke="#334155" rx="4"/>
      <text x="15" y="30" class="text-main">Administrace / Dashboard</text>
      <text x="15" y="55" class="text-sub">• Správa turnajů (Admin)</text>
      <text x="15" y="75" class="text-sub">• Správa týmu (Kapitán)</text>
      <text x="15" y="95" class="text-sub">• Registrace / Pozvánky (Hráč)</text>
    </g>
    <g transform="translate(20, 280)">
      <rect width="200" height="70" fill="#0f172a" stroke="#334155" rx="4"/>
      <text x="15" y="30" class="text-main">Zápasový modul</text>
      <text x="15" y="50" class="text-sub">Zadávání výsledků, screenshoty</text>
    </g>
    <g transform="translate(20, 440)">
      <rect width="200" height="80" fill="#14532d" stroke="#22c55e" rx="4"/>
      <text x="15" y="30" class="text-main" fill="#4ade80">State Management</text>
      <text x="15" y="50" class="text-sub" fill="#ca8a04">URL-driven state (stavy</text>
      <text x="15" y="65" class="text-sub" fill="#ca8a04">předávány skrze parametry)</text>
    </g>
  </g>

  <!-- SERVEROVÁ VRSTVA -->
  <g transform="translate(330, 40)">
    <rect width="240" height="560" class="box-server" rx="8"/>
    <text x="20" y="30" class="text-title" fill="#10b981">SERVEROVÁ VRSTVA (NEXT.JS)</text>
    <g transform="translate(20, 60)">
      <rect width="200" height="80" fill="#0f172a" stroke="#334155" rx="4"/>
      <text x="15" y="30" class="text-main">Serverové komponenty</text>
      <text x="15" y="50" class="text-sub">Přímé bezpečné dotazy</text>
      <text x="15" y="65" class="text-sub">do DB (Prisma)</text>
    </g>
    <g transform="translate(20, 200)">
      <rect width="200" height="120" fill="#111827" stroke="#10b981" rx="4"/>
      <text x="15" y="30" class="text-main" fill="#34d399">Server Actions</text>
      <text x="15" y="55" class="text-sub">Bezpečné mutace dat</text>
      <text x="15" y="75" class="text-sub">• createTournament()</text>
      <text x="15" y="95" class="text-sub">• submitMatchResult()</text>
      <text x="15" y="110" class="text-sub">• joinTeamWithToken()</text>
    </g>
    <g transform="translate(20, 440)">
      <rect width="200" height="80" fill="#0f172a" stroke="#334155" rx="4"/>
      <text x="15" y="30" class="text-main">Middleware / Ochrana</text>
      <text x="15" y="50" class="text-sub">Ochrana rout, kontrola rolí</text>
      <text x="15" y="65" class="text-sub">(Admin / Kapitán / Hráč)</text>
    </g>
  </g>

  <!-- DATA VRSTVA -->
  <g transform="translate(620, 40)">
    <rect width="240" height="240" class="box-db" rx="8"/>
    <text x="20" y="30" class="text-title" fill="#6366f1">DATA &amp; ORM VRSTVA</text>
    <g transform="translate(20, 60)">
      <rect width="200" height="60" fill="#0f172a" stroke="#334155" rx="4"/>
      <text x="15" y="35" class="text-main">Prisma ORM Client</text>
    </g>
    <g transform="translate(20, 140)">
      <rect width="200" height="80" fill="#1e1b4b" stroke="#818cf8" rx="4"/>
      <text x="15" y="30" class="text-main" fill="#a5b4fc">PostgreSQL Databáze</text>
      <text x="15" y="50" class="text-sub">Relace: User 1:1 Profil</text>
      <text x="15" y="65" class="text-sub">Team 1:N Match, User 1:N Team</text>
    </g>
  </g>

  <!-- EXTERNÍ SLUŽBY -->
  <g transform="translate(620, 310)">
    <rect width="240" height="290" class="box-ext" rx="8"/>
    <text x="20" y="30" class="text-title" fill="#f59e0b">EXTERNÍ SLUŽBY (API)</text>
    <g transform="translate(20, 60)">
      <rect width="200" height="60" fill="#0f172a" stroke="#334155" rx="4"/>
      <text x="15" y="30" class="text-main">Discord OAuth 2.0</text>
      <text x="15" y="48" class="text-sub">Autentizace + metadata profilu</text>
    </g>
    <g transform="translate(20, 135)">
      <rect width="200" height="60" fill="#0f172a" stroke="#334155" rx="4"/>
      <text x="15" y="30" class="text-main">Uploadthing CDN</text>
      <text x="15" y="48" class="text-sub">Ukládání screenshotů a log</text>
    </g>
    <g transform="translate(20, 210)">
      <rect width="200" height="60" fill="#0f172a" stroke="#334155" rx="4"/>
      <text x="15" y="30" class="text-main">Discord Webhooks</text>
      <text x="15" y="48" class="text-sub">Notifikace výsledků zápasů</text>
    </g>
  </g>

  <!-- Arrows -->
  <line x1="280" y1="130" x2="320" y2="130" class="arrow" marker-end="url(#arr)" />
  <line x1="280" y1="290" x2="320" y2="290" class="arrow" marker-end="url(#arr)" />
  <line x1="320" y1="310" x2="285" y2="310" class="arrow" marker-end="url(#arr)" />
  <line x1="570" y1="130" x2="610" y2="130" class="arrow-double" marker-end="url(#arr)" />
  <line x1="570" y1="290" x2="610" y2="290" class="arrow-double" marker-end="url(#arr)" />
  <line x1="450" y1="410" x2="450" y2="430" class="arrow" marker-end="url(#arr)" />
  <line x1="570" y1="410" x2="630" y2="410" class="arrow" marker-end="url(#arr)" />
  <line x1="570" y1="485" x2="630" y2="485" class="arrow" marker-end="url(#arr)" />
  <line x1="570" y1="560" x2="630" y2="560" class="arrow" marker-end="url(#arr)" />

  <!-- POST badge -->
  <rect x="285" y="225" width="40" height="16" fill="#10b981" rx="3" />
  <text x="291" y="237" class="badge">POST</text>
</svg>