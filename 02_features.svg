<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <style>
    .actor { fill: #f9f9f9; stroke: #333; stroke-width: 2; rx: 5; ry: 5; }
    .uc { fill: #e2f0d9; stroke: #5e8a3d; stroke-width: 2; }
    .text { font-family: sans-serif; font-size: 13px; fill: #333; }
    .actor-text { font-family: sans-serif; font-size: 14px; fill: #333; font-weight: bold; }
    .line { stroke: #999; stroke-width: 2; fill: none; }
    .boundary { fill: none; stroke: #333; stroke-width: 2; stroke-dasharray: 5,5; }
  </style>

  <rect x="250" y="20" width="500" height="560" class="boundary"/>
  <text x="500" y="45" text-anchor="middle" class="actor-text">Systém pro esport turnaje</text>

  <rect x="50" y="80" width="120" height="40" class="actor"/>
  <text x="110" y="105" text-anchor="middle" class="actor-text">Administrátor</text>

  <rect x="50" y="280" width="120" height="40" class="actor"/>
  <text x="110" y="305" text-anchor="middle" class="actor-text">Kapitán týmu</text>

  <rect x="50" y="420" width="120" height="40" class="actor"/>
  <text x="110" y="445" text-anchor="middle" class="actor-text">Hráč</text>

  <rect x="50" y="520" width="120" height="40" class="actor"/>
  <text x="110" y="545" text-anchor="middle" class="actor-text">Divák</text>

  <ellipse cx="500" cy="80" rx="100" ry="25" class="uc"/>
  <text x="500" y="85" text-anchor="middle" class="text">Spravovat turnaje / Pavouk</text>
  <ellipse cx="500" cy="140" rx="100" ry="25" class="uc"/>
  <text x="500" y="145" text-anchor="middle" class="text">Schvalovat sporné výsledky</text>
  
  <ellipse cx="500" cy="220" rx="100" ry="25" class="uc"/>
  <text x="500" y="225" text-anchor="middle" class="text">Založit a spravovat tým</text>
  <ellipse cx="500" cy="280" rx="100" ry="25" class="uc"/>
  <text x="500" y="285" text-anchor="middle" class="text">Přihlásit tým do turnaje</text>
  <ellipse cx="500" cy="340" rx="100" ry="25" class="uc"/>
  <text x="500" y="345" text-anchor="middle" class="text">Zadat výsledek a důkaz</text>

  <ellipse cx="500" cy="420" rx="100" ry="25" class="uc"/>
  <text x="500" y="425" text-anchor="middle" class="text">Zobrazit profil a statistiky</text>

  <ellipse cx="500" cy="520" rx="100" ry="25" class="uc"/>
  <text x="500" y="525" text-anchor="middle" class="text">Prohlížet žebříčky a turnaje</text>

  <line x1="170" y1="100" x2="400" y2="80" class="line"/>
  <line x1="170" y1="100" x2="400" y2="140" class="line"/>

  <line x1="170" y1="300" x2="400" y2="220" class="line"/>
  <line x1="170" y1="300" x2="400" y2="280" class="line"/>
  <line x1="170" y1="300" x2="400" y2="340" class="line"/>

  <line x1="170" y1="440" x2="400" y2="420" class="line"/>
  <line x1="170" y1="540" x2="400" y2="520" class="line"/>
</svg>
