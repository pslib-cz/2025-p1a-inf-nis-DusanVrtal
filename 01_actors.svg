<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <style>
    .actor-box { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; rx: 8; ry: 8; }
    .actor-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; fill: #f3f4f6; font-weight: 600; text-anchor: middle; }
    .uml-line { stroke: #38bdf8; stroke-width: 2; fill: none; }
  </style>
  
  <defs>
    <marker id="generalization" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect x="225" y="40" width="150" height="50" class="actor-box" />
  <text x="300" y="70" class="actor-text">Divák / Host</text>

  <rect x="225" y="170" width="150" height="50" class="actor-box" />
  <text x="300" y="200" class="actor-text">Hráč</text>

  <rect x="75" y="300" width="150" height="50" class="actor-box" />
  <text x="150" y="330" class="actor-text">Administrátor</text>

  <rect x="375" y="300" width="150" height="50" class="actor-box" />
  <text x="450" y="330" class="actor-text">Kapitán týmu</text>

  <line x1="300" y1="170" x2="300" y2="92" class="uml-line" marker-end="url(#generalization)" />

  <path d="M 150 300 L 150 250 L 450 250 L 450 300" class="uml-line" />
  <line x1="300" y1="250" x2="300" y2="222" class="uml-line" marker-end="url(#generalization)" />
</svg>
